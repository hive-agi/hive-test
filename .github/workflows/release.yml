name: release

# Bump and publish only when the push actually changes the library.
# Raising version.edn's :minor track produces one minor release; later pushes
# resume patch bumps inside that track.
# README / CI / test-only commits do not mint a version, because a published
# pom is immutable on both Clojars and the private registry.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'resources/**'
      - 'deps.edn'
      - 'version.edn'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest

      # Gate BEFORE the bump: a published pom is immutable, so a red suite
      # must not be able to mint a version, tag it and ship it.
      - name: Test
        run: |
          if [ -d test ]; then
            clojure -M:test
          else
            echo "no test/ directory — nothing to gate on"
          fi

      - name: Bump version
        run: |
          LEVEL="$(clojure -M -e '
            (require (quote [clojure.edn :as edn])
                     (quote [clojure.string :as str]))
            (let [target-minor (:minor (edn/read-string (slurp "version.edn")))
                  [_ current-minor _]
                  (mapv parse-long (str/split (str/trim (slurp "VERSION")) #"\."))]
              (print (if (> target-minor current-minor) "minor" "patch")))')"
          clojure -T:build bump :level ":${LEVEL}"

      - name: Commit and tag
        run: |
          VER=$(cat VERSION)
          git config user.name  "hive-ci"
          git config user.email "ci@hive-agi.local"
          git add VERSION
          # [skip ci] stops this push from retriggering the workflow.
          git commit -m "chore(release): $VER [skip ci]"
          # Annotated: `git push --follow-tags` ignores lightweight tags,
          # which would publish the artifact and silently drop the tag.
          git tag -a "v$VER" -m "release $VER"
          git push --follow-tags

      - name: Deploy
        env:
          # The hive-agi org secret is CLOJARS_DEPLOY_TOKEN, while deps-deploy
          # and build.clj both read CLOJARS_PASSWORD. Map one onto the other.
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_DEPLOY_TOKEN }}
        run: clojure -T:build deploy
